<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색엔진 링크 실습</title>
    <style>
        /* 기본 페이지 스타일 설정 */
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', dotum, '돋움', sans-serif;
            text-align: center; /* 전체 요소를 가운데 정렬합니다 */
            margin-top: 80px; /* 상단에 여백을 주어 보기 좋게 배치합니다 */
            background-color: #ffffff;
            color: #333333;
        }

        /* 제목 스타일 */
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: -1px; /* 글자 간격을 살짝 좁혀 시안과 비슷하게 만듭니다 */
        }

        /* 보라색 구분선 스타일 */
        hr.divider {
            border: none;
            height: 2px; /* 선의 두께 */
            background-color: #9b59b6; /* 시안과 유사한 보라색 */
            width: 200px; /* 선의 길이 제한 */
            margin: 0 auto 30px auto; /* 가운데 정렬 및 아래쪽 여백 지정 */
        }

        /* p 태그 링크 항목 간격 설정 */
        p.link-item {
            margin: 0 0 20px 0; /* p 태그의 기본 마진을 초기화하고 아래쪽 여백만 줍니다 */
        }

        /* 링크(A 태그) 스타일 */
        a {
            text-decoration: none; /* 링크의 기본 밑줄을 제거합니다 */
            color: #444444; /* 글자 색상을 어두운 회색으로 설정합니다 */
            font-size: 16px;
        }

        /* 마우스 오버 시 효과 (선택적 추가) */
        a:hover {
            color: #000000;
            text-decoration: underline; /* 마우스를 올렸을 때 밑줄이 생기도록 합니다 */
        }
    </style>
</head>
<body>

    <!-- 제목 부분 -->
    <h1>검색엔진</h1>
    
    <!-- 보라색 구분선 -->
    <hr class="divider">

    <!-- 링크 목록 부분 (ul/li 대신 p 태그 사용) -->
    <p class="link-item"><a href="https://www.naver.com" target="_blank" title="네이버 새창열기">네이버</a></p>
    <p class="link-item"><a href="https://www.daum.net" target="_blank" title="다음 새창열기">다음</a></p>
    <p class="link-item"><a href="https://www.google.com" target="_blank" title="구글 새창열기">구글</a></p>
    <p class="link-item"><a href="https://www.nate.com" target="_blank" title="네이트 새창열기">네이트</a></p>
    <p class="link-item"><a href="https://www.epost.go.kr" target="_blank" title="인터넷 우체국 새창열기">배송조회</a></p>
    <p class="link-item"><a href="./ai_imgsearch.html">쇼핑몰 사이트로 가기</a></p>

</body>
</html>
