<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진달래꽃</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(180deg, #fff8fb 0%, #fdf1f7 100%);
      color: #2f1f2a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(180, 120, 150, 0.2);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(120, 70, 95, 0.12);
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      text-align: center;
      letter-spacing: -0.04em;
      color: #333333;
    }

    h2 {
      margin: 14px 0 36px;
      font-size: 1.3rem;
      text-align: right;
      font-weight: 500;
      color: #6f5261;
    }

    .poem {
      display: grid;
      gap: 24px;
    }

    .verse {
      padding: 20px 22px;
      background: #fff;
      border-radius: 18px;
      border-left: 5px solid #d97aa5;
      box-shadow: 0 8px 24px rgba(160, 95, 128, 0.08);
    }

    .verse p {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.9;
      white-space: pre-line;
    }

    @media (max-width: 640px) {
      .container {
        padding: 32px 22px;
      }

      h1 {
        font-size: 2.3rem;
      }

      h2 {
        font-size: 1.1rem;
      }

      .verse p {
        font-size: 1.08rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>진달래꽃</h1>
    <h2>지은이 김소월</h2>

    <section class="poem">
      <article class="verse">
        <p>나 보기가 
역겨워
가실때에는</p>
      </article>

      <article class="verse">
        <p>말 없이
고이 
보내 드리오리다</p>
      </article>

      <article class="verse">
        <p>영변의 
약산
진달래 꽃</p>
      </article>

      <article class="verse">
        <p>진달래
진달래 꽃
피웠네</p>
      </article>
    </section>
  </main>
</body>
</html>
