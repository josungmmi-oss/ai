<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAMBAK</title>
    <!-- Tailwind CSS (스타일링 용도) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #005bc5;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #e5e7eb; /* 데스크톱에서 보이는 배경색 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        /* 모바일 디바이스 프레임 시뮬레이션 */
        .mobile-container {
            width: 100%;
            height: 100vh;
            max-width: 400px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        /* 데스크톱 화면일 경우 아이폰 프레임처럼 보이도록 둥근 테두리 적용 */
        @media (min-width: 401px) {
            .mobile-container {
                height: 850px;
                max-height: 90vh;
                border-radius: 40px;
                border: 12px solid #1f2937;
            }
        }
        /* 스크롤바 숨기기 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 스플래시 화면 페이드 아웃 애니메이션 */
        .splash-fade-out {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
        }
        .main-content-fade-in {
            opacity: 1 !important;
        }
        
        /* 탭 활성화 상태 스타일 */
        .tab-active {
            color: var(--primary-blue);
        }
        .tab-inactive {
            color: #9ca3af;
        }
        
        /* 화면 전환용 컨텐츠 */
        .page-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .page-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- ==============================
             스플래시 화면 (제공된 이미지 기반)
        =============================== -->
        <div id="splash-screen" class="absolute inset-0 bg-white z-50 flex flex-col">
            <!-- iOS 상단 상태바 -->
            <div class="w-full flex justify-between items-center px-6 py-4 text-black text-[15px] font-semibold">
                <span>9:41</span>
                <div class="flex items-center space-x-1.5">
                    <!-- Cellular -->
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2L2 22z"/></svg>
                    <!-- Wi-Fi -->
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C7.95 3 4.21 4.34 1.2 6.6L12 22l10.8-15.4C19.79 4.34 16.05 3 12 3zm0 2c3.53 0 6.82 1.13 9.4 3.05L12 18.3 2.6 8.05C5.18 6.13 8.47 5 12 5z"/></svg>
                    <!-- Battery -->
                    <svg class="w-6 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="6" width="16" height="12" rx="3"/><path d="M22 10v4"/></svg>
                </div>
            </div>

            <!-- 중앙 로고 컨텐츠 -->
            <div class="flex-1 flex flex-col justify-center items-center pb-24">
                <svg viewBox="0 0 160 120" class="w-36 h-auto mb-1" xmlns="http://www.w3.org/2000/svg">
                    <!-- 1. 지면 곡선 -->
                    <path d="M 5 95 Q 80 82 155 95" stroke="#005bc5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    
                    <!-- 2. 차체 -->
                    <!-- 차 모양 패스 -->
                    <path d="M 20 85 L 20 65 L 25 55 L 40 55 L 55 45 L 105 45 L 115 55 L 125 55 L 130 65 L 130 85 Z" fill="#005bc5" />
                    
                    <!-- 창문 (차체에 흰색으로 덮어 표현) -->
                    <path d="M 45 57 L 55 57 L 55 49 L 50 49 Z" fill="white" />
                    <path d="M 59 57 L 80 57 L 80 49 L 59 49 Z" fill="white" />
                    <path d="M 84 57 L 105 57 L 105 49 L 84 49 Z" fill="white" />
                    
                    <!-- 헤드라이트 -->
                    <rect x="22" y="70" width="8" height="6" fill="white" rx="2"/>
                    
                    <!-- 바퀴 -->
                    <circle cx="40" cy="90" r="10" fill="#005bc5" />
                    <circle cx="110" cy="90" r="10" fill="#005bc5" />
                    <circle cx="40" cy="90" r="4" fill="white" />
                    <circle cx="110" cy="90" r="4" fill="white" />

                    <!-- 3. 루프탑 텐트 -->
                    <path d="M 65 45 L 90 20 L 110 45 Z" fill="#005bc5" />
                    <path d="M 65 45 L 110 45" stroke="white" stroke-width="3" />
                    <path d="M 80 32 L 90 45" stroke="white" stroke-width="2" />
                    
                    <!-- 4. 달 -->
                    <path d="M 55 25 A 12 12 0 1 0 75 8 A 14 14 0 0 1 55 25 Z" fill="#005bc5" />

                    <!-- 5. 별 -->
                    <!-- 큰 별 -->
                    <path d="M 30 35 L 32 40 L 37 42 L 32 44 L 30 49 L 28 44 L 23 42 L 28 40 Z" fill="#005bc5" />
                    <!-- 작은 별 -->
                    <path d="M 85 10 L 86 13 L 89 14 L 86 15 L 85 18 L 84 15 L 81 14 L 84 13 Z" fill="#005bc5" />
                </svg>
                <h1 class="text-[32px] font-black tracking-tighter" style="color: #005bc5; font-family: 'Arial', sans-serif;">CAMBAK</h1>
            </div>

            <!-- iOS 하단 홈 인디케이터 -->
            <div class="absolute bottom-2 w-full flex justify-center pb-2">
                <div class="w-1/3 h-[5px] bg-black rounded-full"></div>
            </div>
        </div>

        <!-- ==============================
             메인 앱 화면 (스플래시 이후 표시됨)
        =============================== -->
        <div id="main-app" class="flex-1 flex flex-col opacity-0 h-full bg-white relative">
            
            <!-- 상단 헤더 -->
            <header class="flex justify-between items-center px-5 py-4 pt-12 bg-white sticky top-0 z-10 border-b border-gray-100">
                <div class="text-[20px] font-black tracking-tighter" style="color: #005bc5;">CAMBAK</div>
                <div class="flex space-x-4 text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </div>
            </header>

            <!-- 스크롤 가능한 메인 컨텐츠 영역 -->
            <main class="flex-1 overflow-y-auto hide-scrollbar pb-24 bg-gray-50 relative">
                
                <!-- 홈 탭 컨텐츠 -->
                <div id="tab-home" class="page-content active">
                    <!-- 환영 배너 -->
                    <div class="px-5 py-6 bg-white">
                        <h2 class="text-2xl font-bold text-gray-800 leading-tight mb-2">오늘 떠나기 좋은<br><span style="color: #005bc5;">차박 명소</span>는 어디일까요?</h2>
                        <p class="text-sm text-gray-500 mb-5">자연과 함께하는 완벽한 하루를 찾아보세요.</p>
                        
                        <!-- 카테고리 -->
                        <div class="grid grid-cols-4 gap-3 text-center">
                            <div class="flex flex-col items-center cursor-pointer">
                                <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center mb-2 shadow-sm text-2xl">🌊</div>
                                <span class="text-xs font-medium text-gray-700">해변/바다</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer">
                                <div class="w-14 h-14 rounded-full bg-green-50 flex items-center justify-center mb-2 shadow-sm text-2xl">⛰️</div>
                                <span class="text-xs font-medium text-gray-700">산/숲속</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer">
                                <div class="w-14 h-14 rounded-full bg-cyan-50 flex items-center justify-center mb-2 shadow-sm text-2xl">🏞️</div>
                                <span class="text-xs font-medium text-gray-700">계곡/강</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer">
                                <div class="w-14 h-14 rounded-full bg-yellow-50 flex items-center justify-center mb-2 shadow-sm text-2xl">⛺</div>
                                <span class="text-xs font-medium text-gray-700">오토캠핑</span>
                            </div>
                        </div>
                    </div>

                    <!-- 추천 차박지 리스트 -->
                    <div class="px-5 py-6">
                        <div class="flex justify-between items-end mb-4">
                            <h3 class="text-lg font-bold text-gray-800">이번 주말 베스트 스팟 🏕️</h3>
                            <span class="text-xs font-medium text-gray-400 cursor-pointer">더보기 &gt;</span>
                        </div>
                        
                        <div class="flex space-x-4 overflow-x-auto hide-scrollbar pb-2">
                            <!-- 카드 1 -->
                            <div class="min-w-[200px] w-[200px] bg-white rounded-2xl shadow-sm overflow-hidden flex-shrink-0">
                                <div class="h-32 bg-gray-200 relative">
                                    <div class="absolute top-2 right-2 bg-white/80 rounded-full p-1.5 backdrop-blur-sm">
                                        <svg class="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
                                    </div>
                                    <img src="https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="camp" class="w-full h-full object-cover" onerror="this.src=''; this.className='w-full h-full bg-gradient-to-tr from-blue-300 to-blue-500';">
                                </div>
                                <div class="p-4">
                                    <div class="text-xs text-blue-600 font-bold mb-1">강원도 평창</div>
                                    <h4 class="font-bold text-gray-800 text-sm mb-1 truncate">별이 쏟아지는 육백마지기</h4>
                                    <p class="text-xs text-gray-500 flex items-center">
                                        <svg class="w-3 h-3 mr-1 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                        4.8 (124)
                                    </p>
                                </div>
                            </div>
                            <!-- 카드 2 -->
                            <div class="min-w-[200px] w-[200px] bg-white rounded-2xl shadow-sm overflow-hidden flex-shrink-0">
                                <div class="h-32 bg-gray-200 relative">
                                    <img src="https://images.unsplash.com/photo-1533873984024-ce5f9920b784?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="camp" class="w-full h-full object-cover" onerror="this.src=''; this.className='w-full h-full bg-gradient-to-tr from-green-300 to-green-500';">
                                </div>
                                <div class="p-4">
                                    <div class="text-xs text-blue-600 font-bold mb-1">충남 태안</div>
                                    <h4 class="font-bold text-gray-800 text-sm mb-1 truncate">파도소리 몽산포 해수욕장</h4>
                                    <p class="text-xs text-gray-500 flex items-center">
                                        <svg class="w-3 h-3 mr-1 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                        4.5 (89)
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 지도 탭 (임시 화면) -->
                <div id="tab-map" class="page-content h-full">
                    <div class="flex flex-col items-center justify-center h-full text-gray-500 pt-20">
                        <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                        <p class="font-medium">지도 기반 차박지 검색</p>
                        <p class="text-sm mt-2">서비스 준비 중입니다.</p>
                    </div>
                </div>

                <!-- 커뮤니티 탭 (임시 화면) -->
                <div id="tab-community" class="page-content h-full">
                    <div class="flex flex-col items-center justify-center h-full text-gray-500 pt-20">
                        <svg class="w-16 h-16 mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
                        <p class="font-medium">캠핑/차박 커뮤니티</p>
                        <p class="text-sm mt-2">유저들의 후기를 기대해주세요.</p>
                    </div>
                </div>

            </main>

            <!-- 하단 네비게이션 바 -->
            <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-6 py-3 pb-8 z-20">
                <div class="flex justify-between items-center text-xs font-medium">
                    <!-- 홈 -->
                    <div class="nav-btn flex flex-col items-center cursor-pointer tab-active" data-target="tab-home">
                        <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                        <span>홈</span>
                    </div>
                    <!-- 지도 -->
                    <div class="nav-btn flex flex-col items-center cursor-pointer tab-inactive" data-target="tab-map">
                        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>지도</span>
                    </div>
                    <!-- 커뮤니티 -->
                    <div class="nav-btn flex flex-col items-center cursor-pointer tab-inactive" data-target="tab-community">
                        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span>소통</span>
                    </div>
                    <!-- 마이페이지 -->
                    <div class="nav-btn flex flex-col items-center cursor-pointer tab-inactive">
                        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span>마이</span>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 3초(3000ms) 후 네이버로 자동 이동
            setTimeout(() => {
                window.location.href = "./work1.html";
            }, 3000);
        });
    </script>
</body>
</html>
