<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조성미 홈페이지</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(180deg, #f7f8fb 0%, #eef2f7 100%);
      color: #333333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 2.8rem;
      text-align: center;
      letter-spacing: -0.03em;
      color: #333333;
    }

    .content {
      display: grid;
      gap: 24px;
    }

    .section {
      padding: 22px 24px;
      background: #f9fafb;
      border-radius: 18px;
      border-left: 5px solid #9ca3af;
    }

    p {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.9;
      white-space: pre-line;
      text-align: center;
    }

    h2 {
      margin: 12px 0 0;
      font-size: 1.25rem;
      text-align: center;
      font-weight: 500;
      color: #4b5563;
    }

    .email {
      color: #2563eb;
      font-weight: 500;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .container {
        padding: 32px 22px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1.05rem;
      }

      h2 {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>조성미 홈페이지에 오신 것을 환영합니다.</h1>

    <section class="content">
      <article class="section">
        <p>멋진 홈페이지가 되도록 노력
부디 저의 홈페이지에서 좋은 시간 가지시기 바라며
가실 때에 따듯한 글을 남겨주시면 감사하겠습니다</p>
      </article>

      <article class="section">
        <p>그리고 제 홈페이지에 궁금한 점이 있으시면
<a class="email" href="mailto:josungmmi@naver.com">josungmmi@naver.com</a> 으로
메일 보내주시기 바랍니다.</p>
      </article>
    </section>

    <h2>KD컴퓨터학원 강의실에서</h2>
  </main>
</body>
</html>
