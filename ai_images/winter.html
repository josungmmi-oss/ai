<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>겨울의 계절</title>
    <style>
        /* 페이지 전체 기본 설정 및 배경색 지정 */
        body {
            background-color: #dadada; /* 시안과 유사한 밝은 회색 배경 */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 화면 중앙에 위치하도록 설정 */
            font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
        }
        
        /* 중앙 컨텐츠를 담는 래퍼 */
        .container {
            width: 100%;
            max-width: 600px; /* 원본 비율과 유사한 너비 */
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 상단 제목 스타일 */
        h1 {
            color: #6262ff; /* 시안의 푸른빛 텍스트 색상 */
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
        }

        /* 위아래 진한 회색 구분선 */
        .line {
            height: 4px; /* 선의 두께 */
            background-color: #333333; /* 진한 회색 */
            width: 100%;
        }

        /* 이미지 컨테이너 (선과 이미지 사이의 간격 조정) */
        .image-box {
            margin: 15px 0; 
        }

        /* 이미지 반응형 처리 */
        .image-box img {
            width: 100%;
            display: block;
        }

        /* 하단 텍스트 스타일 */
        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #222222;
            cursor: pointer; /* 마우스 오버 시 클릭 가능한 느낌 부여 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 텍스트 -->
        <h1>겨울의 계절</h1>
        
        <!-- 상단 구분선 -->
        <div class="line"></div>
        
        <!-- 중앙 겨울 이미지 -->
        <div class="image-box">
            <!-- 시안과 비슷한 분위기의 무료 이미지를 임시로 넣었습니다. 프로젝트의 실제 이미지 경로로 수정해 사용하세요. -->
            <img src="https://images.unsplash.com/photo-1483664852095-d6cc6870702d?auto=format&fit=crop&w=800&q=80" alt="겨울 풍경">
        </div>
        
        <!-- 하단 구분선 -->
        <div class="line"></div>
        
        <!-- 하단 텍스트 -->
        <div class="footer-text">
            [메인화면으로 이동]
        </div>
    </div>

</body>
</html>
