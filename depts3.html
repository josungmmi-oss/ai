<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Claude Header - Desktop Fixed</title>
    <style>
        /* 기본 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 브라우저 기본 폰트 설정 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            /* 반응형 절대 방지: 최소 너비를 강제로 고정 */
            min-width: 1200px;
            background-color: #000000; /* 시안과 유사하게 하단 배경은 검정색으로 지정 */
        }

        /* 헤더 전체를 감싸는 영역 */
        .header-wrapper {
            background-color: #ffffff;
            width: 100%;
            min-width: 1200px; /* 창을 줄여도 헤더 배경이 끊기지 않도록 고정 */
            position: relative; /* 서브 메뉴의 절대 위치 기준점 */
            z-index: 100;
        }

        /* 실제 헤더 콘텐츠가 들어가는 고정 너비 영역 */
        .header-content {
            width: 1200px; /* 고정 너비 할당 (반응형 배제) */
            height: 80px;
            margin: 0 auto; /* 중앙 정렬 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        /* 1. 로고 영역 */
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* 로고 아이콘 (SVG 형상화) */
        .logo-icon {
            width: 28px;
            height: 28px;
            fill: #d36a4a; /* 시안의 주황/갈색 톤 */
        }

        /* 로고 텍스트 */
        .logo-text {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 30px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        /* 2. 네비게이션 영역 */
        .nav-area {
            display: flex;
            align-items: center;
            gap: 32px;
            height: 100%;
        }

        /* 1차 메뉴와 2차 메뉴를 묶는 래퍼 */
        .nav-item-wrap {
            height: 100%;
            display: flex;
            align-items: center;
            position: relative; /* 서브메뉴의 텍스트 정렬 기준점 추가 */
        }

        .nav-item {
            text-decoration: none;
            color: #333333; /* 요청하신 1차 메뉴 색상으로 수정 */
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            position: relative;
            display: flex;
            align-items: center;
            height: 80px; /* 헤더 전체 높이에 맞춤 */
            transition: color 0.2s ease-in-out;
        }

        /* 5px 두께의 Bottom Stroke 설정 */
        .nav-item::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0; /* nav-item의 height가 80px이므로 헤더 맨 바닥에 위치 */
            width: 100%; /* 글자 너비(간격)만큼 꽉 채움 */
            height: 5px; /* 요청하신 5px 두께 */
            background-color: #d36a4a; /* 오렌지색 */
            transform: scaleX(0); /* 기본 상태에서는 보이지 않음 */
            transition: transform 0.2s ease-in-out;
            transform-origin: center; /* 가운데서부터 양옆으로 나타나는 효과 */
        }

        /* 1차 메뉴 래퍼(nav-item-wrap)에 호버 시 1차 메뉴 활성화 유지 */
        .nav-item-wrap:hover .nav-item,
        .nav-item:hover {
            color: #d36a4a; 
        }

        .nav-item-wrap:hover .nav-item::after,
        .nav-item:hover::after {
            transform: scaleX(1); /* 호버 시 밑줄 표시 */
        }

        /* 2차 메뉴 (서브 메뉴) 영역 - 세로 드롭다운 형태로 변경 */
        .sub-menu {
            position: absolute;
            top: 80px; /* 헤더 바로 아래 위치 */
            left: 50%; /* 1차 메뉴의 중앙에 맞춤 */
            transform: translateX(-50%); /* 정확히 중앙 정렬 */
            background-color: #ffffff;
            border: 1px solid #f0f0f0; /* 드롭다운 테두리 */
            box-shadow: 0 8px 16px rgba(0,0,0,0.08); /* 입체감 있는 그림자 */
            min-width: 160px; /* 세로 드롭다운 박스의 최소 너비 */
            padding: 8px 0; /* 위아래 여백 */
            display: flex;
            flex-direction: column; /* 세로 방향으로 나열 */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease-in-out, visibility 0.2s ease-in-out;
            z-index: 100;
            border-radius: 0 0 8px 8px; /* 하단 모서리를 살짝 둥글게 */
        }

        /* 1차 메뉴 호버 시 2차 메뉴 표시 */
        .nav-item-wrap:hover .sub-menu {
            opacity: 1;
            visibility: visible;
        }

        .sub-item {
            text-decoration: none;
            color: #616161;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.5px;
            padding: 12px 20px; /* 위아래 패딩으로 클릭 영역 넓힘 */
            text-align: center; /* 2차 메뉴 글자 가운데 정렬 */
            width: 100%;
            display: block; /* 블록 요소로 변경하여 전체 너비 차지 */
            transition: color 0.2s ease-in-out, background-color 0.2s ease-in-out;
        }

        .sub-item:hover {
            color: #d36a4a; /* 호버 시 오렌지색으로 변경 */
            background-color: #fcece8; /* 호버 시 연한 오렌지색 배경 */
        }

        /* 3. 우측 액션 버튼 영역 */
        .action-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            height: 42px;
            padding: 0 24px;
            border-radius: 21px; /* 둥근 알약 형태 */
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        /* 매장찾기 버튼 */
        .btn-dark {
            background-color: #333333;
            color: #ffffff;
            transition: background-color 0.2s;
        }

        .btn-dark:hover {
            background-color: #1a1a1a;
        }

        /* 글로드마켓 버튼 */
        .btn-orange {
            background-color: #d67a5d;
            color: #ffffff;
            transition: background-color 0.2s;
        }

        .btn-orange:hover {
            background-color: #c46445;
        }

        /* 4. 메인 콘텐츠 (기업 이미지 영역) */
        .main-content {
            width: 1200px;
            margin: 0 auto; /* 헤더와 동일하게 중앙 정렬 */
            padding-top: 40px; /* 헤더와의 여백 */
            padding-bottom: 80px;
        }

        .company-image {
            width: 100%; /* 1200px에 꽉 차게 설정 */
            height: auto;
            border-radius: 12px; /* 부드러운 모서리 적용 */
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* 입체감을 위한 그림자 */
            opacity: 0.8; /* 이미지에 80% 투명도 적용 */
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 시작 -->
    <header class="header-wrapper">
        <div class="header-content">
            
            <!-- 왼쪽: 로고 -->
            <div class="logo-area">
                <svg class="logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <!-- 별 모양 아이콘 패스 -->
                    <path d="M12 1L12.6 8.5L18.5 4L14.5 9.5L22 12L14.5 14.5L18.5 20L12.6 15.5L12 23L11.4 15.5L5.5 20L9.5 14.5L2 12L9.5 9.5L5.5 4L11.4 8.5L12 1Z" />
                </svg>
                <span class="logo-text">Claude</span>
            </div>

            <!-- 중앙: 네비게이션 메뉴 -->
            <nav class="nav-area">
                <!-- ABOUT 메뉴 및 하위 2차 메뉴 -->
                <div class="nav-item-wrap">
                    <a href="#" class="nav-item">ABOUT</a>
                    <div class="sub-menu">
                        <a href="#" class="sub-item">대표 인사말</a>
                        <a href="#" class="sub-item">기업소개</a>
                        <a href="#" class="sub-item">비주얼아이덴티티</a>
                        <a href="#" class="sub-item">사회공헌</a>
                        <a href="#" class="sub-item">오시는길</a>
                    </div>
                </div>
                
                <!-- PRODUCTS 메뉴 및 하위 2차 메뉴 (텍스트 변경) -->
                <div class="nav-item-wrap">
                    <a href="#" class="nav-item">PRODUCTS</a>
                    <div class="sub-menu">
                        <a href="#" class="sub-item">AI & 인공지능</a>
                        <a href="#" class="sub-item">SONNET 모델</a>
                        <a href="#" class="sub-item">CODING PRO</a>
                        <a href="#" class="sub-item">대표적인 AI</a>
                    </div>
                </div>
                
                <!-- PARTNERSHIP 메뉴 및 하위 2차 메뉴 (순서 변경) -->
                <div class="nav-item-wrap">
                    <a href="#" class="nav-item">PARTNERSHIP</a>
                    <div class="sub-menu">
                        <a href="#" class="sub-item">가맹점 현황</a>
                        <a href="#" class="sub-item">가맹점 개설 안내</a>
                        <a href="#" class="sub-item">가맹점 개설 문의</a>
                        <a href="#" class="sub-item">제휴 문의</a>
                    </div>
                </div>

                <!-- EDUCATION 메뉴 (순서 변경) -->
                <div class="nav-item-wrap"><a href="#" class="nav-item">EDUCATION</a></div>
                
                <!-- WHAT'S NEWS 메뉴 (텍스트 변경) -->
                <div class="nav-item-wrap"><a href="#" class="nav-item">WHAT'S NEWS</a></div>

                <!-- SUPPORT 메뉴 -->
                <div class="nav-item-wrap"><a href="#" class="nav-item">SUPPORT</a></div>
            </nav>

            <!-- 오른쪽: 버튼 -->
            <div class="action-area">
                <button class="btn btn-dark">매장찾기</button>
                <button class="btn btn-orange">글로드마켓</button>
            </div>

        </div>
    </header>
    <!-- 헤더 영역 끝 -->

    <!-- 메인 컨텐츠 영역 (기업 이미지) -->
    <main class="main-content">
        <!-- 기업 야외 분위기 이미지로 교체 -->
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80" alt="기업 야외 분위기 이미지" class="company-image">
    </main>

</body>
</html>
